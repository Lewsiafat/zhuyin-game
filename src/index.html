<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>注音打字大冒險</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
:root{
  /* Mobile default: fill screen width based on 11-key number row */
  --key-w: clamp(22px, calc((100vw - 24px) / 11), 36px);
  --key-h: clamp(30px, 5.5vh, 44px);
  --zh-size: clamp(12px, 3.4vw, 17px);
  --en-size: clamp(7px, 2vw, 10px);
}
/* Tablet */
@media(min-width:600px){
  :root{--key-w:44px;--key-h:50px;--zh-size:20px;--en-size:11px;}
}
/* Desktop */
@media(min-width:900px){
  :root{--key-w:52px;--key-h:58px;--zh-size:24px;--en-size:13px;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#eee;font-family:'Noto Sans TC',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;user-select:none}
#mobile-input{position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;top:0;left:0}

/* ── Monster area ── */
#monster-area{position:relative;flex:1 1 auto;min-height:180px;background:#87CEEB;border-bottom:2px solid #533483;overflow:hidden}
#monster-canvas{display:block}
#timer-bar-wrap{position:absolute;top:0;left:0;right:0;height:6px;background:#333}
#timer-bar{height:100%;transition:width 0.1s linear;border-radius:0 3px 3px 0}
#hud{position:absolute;top:8px;left:10px;display:flex;gap:14px;align-items:center}
#hud .hp span{font-size:16px}
#hud .score{color:#ffd700;font-weight:700;font-size:15px}
#hud .level{color:#a78bfa;font-size:12px}
#combo-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:900;color:#ffd700;text-shadow:0 0 16px #ff9500;pointer-events:none;opacity:0;transition:opacity 0.3s;white-space:nowrap}
#combo-msg.show{opacity:1}
#penalty-msg{position:absolute;top:30%;right:14px;font-size:18px;font-weight:900;color:#f87171;text-shadow:0 0 10px #dc2626;pointer-events:none;opacity:0;white-space:nowrap}
#penalty-msg.show{opacity:1;animation:floatup 0.6s ease-out forwards}
@keyframes floatup{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-22px);opacity:0}}
#dmg-flash{position:absolute;inset:0;background:rgba(255,0,0,0);pointer-events:none;transition:background 0.15s}
#dmg-flash.flash{background:rgba(255,0,0,0.32)}

/* ── Sentence display ── */
#typing-area{flex:0 0 auto;padding:6px 8px 5px;background:#0d0d1a;border-bottom:1px solid #2d2d4e}
#sentence-display{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:flex-end;min-height:60px}

/* Word group: hanzi on top, zhuyin symbols below */
.word-group{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:3px 5px;border-radius:8px;border:2px solid transparent;
  transition:border-color 0.15s,background 0.15s;
}
.word-group.wg-current{border-color:#4f46e5;background:#1a1a3a}
.word-group.wg-done{border-color:#16a34a;background:#052e16}
.hanzi{font-size:clamp(14px,4vw,20px);font-weight:700;color:#4f4f7a;transition:color 0.2s;line-height:1}
.wg-current .hanzi{color:#a5b4fc}
.wg-done .hanzi{color:#4ade80}
.zhuyin-row{display:flex;gap:2px}

/* Individual zhuyin symbol */
.zchar{
  font-size:clamp(16px,4.5vw,22px);font-weight:700;padding:2px 3px;
  border-radius:5px;color:#555;background:#1e1e3a;border:2px solid transparent;
  transition:all 0.12s;line-height:1;min-width:clamp(18px,5vw,26px);text-align:center;
}
.zchar.zc-current{color:#fff;background:#2d2d5a;border-color:#818cf8;animation:blink 0.8s infinite}
.zchar.zc-correct{color:#4ade80;background:#052e16;border-color:#16a34a}
.zchar.zc-wrong{color:#f87171;background:#450a0a;border-color:#dc2626;animation:shake 0.3s}
@keyframes blink{0%,100%{border-color:#818cf8}50%{border-color:#4f46e5}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#progress-bar-wrap{height:3px;background:#1e1e3a;border-radius:2px;margin-top:4px}
#progress-bar{height:100%;background:linear-gradient(90deg,#818cf8,#4ade80);border-radius:2px;transition:width 0.2s}

/* ── Keyboard ── */
#keyboard-area{flex:1;background:#111125;padding:4px 4px;display:flex;flex-direction:column;justify-content:center;gap:3px;overflow:hidden}
.kb-row{display:flex;justify-content:center;gap:3px}
.kkey{
  width:var(--key-w);height:var(--key-h);border-radius:5px;
  background:#1e1e3a;border:1px solid #2d2d5a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.08s;line-height:1;padding:1px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;flex-shrink:0;
}
.kkey .zh{font-size:var(--zh-size);color:#e0e7ff;font-weight:700}
.kkey .en{font-size:var(--en-size);color:#6366f1;margin-top:1px}
.kkey:active,.kkey.active{background:#4f46e5;border-color:#818cf8;transform:scale(0.88)}
.kkey:active .zh,.kkey.active .zh{color:#fff}
.kkey.tone{background:#1a1a3a;border-color:#3d2d6a}
.kkey.tone .zh{color:#fbbf24;font-size:var(--zh-size)}
.kkey.spc{width:auto;padding:0 16px;white-space:nowrap}
.kkey.spc .zh{font-size:clamp(10px,2.5vw,14px)}

/* ── Overlays ── */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px;text-align:center}
#overlay h1{font-size:clamp(24px,6vw,34px);color:#a78bfa;margin-bottom:8px;text-shadow:0 0 20px #7c3aed}
#overlay p{color:#94a3b8;margin-bottom:18px;font-size:clamp(13px,3.5vw,15px);max-width:300px;line-height:1.7}
.btn{padding:11px 28px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-size:clamp(15px,4vw,18px);cursor:pointer;font-weight:700;touch-action:manipulation}
.btn:active{background:#6366f1;transform:scale(0.97)}
#gameover-title{color:#f87171;font-size:clamp(28px,7vw,38px);margin-bottom:6px}
#final-score{color:#ffd700;font-size:clamp(20px,5vw,26px);margin-bottom:8px}
</style>
</head>
<body>
<div id="app">

  <input id="mobile-input" ref="mobileInput" type="text"
    autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
    @input="onMobileInput" @blur="refocusMobile"/>

  <!-- Monster area -->
  <div id="monster-area" @click="focusMobile">
    <div id="timer-bar-wrap">
      <div id="timer-bar" :style="{width:timerPct+'%',background:timerPct<30?'#f87171':'#00d4ff'}"></div>
    </div>
    <canvas id="monster-canvas"></canvas>
    <div id="hud">
      <div class="hp"><span v-for="i in 3" :key="i">{{hp>=i?'❤️':'🖤'}}</span></div>
      <div class="score">⭐ {{score}}</div>
      <div class="level">Lv.{{level}}</div>
    </div>
    <div id="combo-msg" ref="comboMsg"></div>
    <div id="penalty-msg" ref="penaltyMsg">⏱ -2秒</div>
    <div id="dmg-flash" ref="dmgFlash"></div>
  </div>

  <!-- Sentence display with hanzi above zhuyin groups -->
  <div id="typing-area" @click="focusMobile">
    <div id="sentence-display">
      <div v-for="(word, wi) in currentWords" :key="wi"
           :class="['word-group',{
             'wg-done':  word.startIdx + word.z.length <= cursor,
             'wg-current': cursor >= word.startIdx && cursor < word.startIdx + word.z.length
           }]">
        <div class="hanzi">{{word.h}}</div>
        <div class="zhuyin-row">
          <div v-for="(zh, zi) in word.z" :key="zi"
               :class="['zchar',{
                 'zc-correct': (word.startIdx+zi) < cursor,
                 'zc-current': (word.startIdx+zi) === cursor,
                 'zc-wrong':   wrongIdx === (word.startIdx+zi) && wrongIdx === cursor
               }]">{{zh}}</div>
        </div>
      </div>
    </div>
    <div id="progress-bar-wrap">
      <div id="progress-bar" :style="{width:(cursor/Math.max(flatLen,1)*100)+'%'}"></div>
    </div>
  </div>

  <!-- Keyboard -->
  <div id="keyboard-area">
    <div v-for="(row,ri) in kbRows" :key="ri" class="kb-row">
      <div v-for="k in row" :key="k.en"
           :class="['kkey',{active:activeKeys.has(k.en),tone:k.tone,spc:k.en==='SPC'}]"
           @mousedown.prevent="pressKey(k.en)"
           @touchstart.prevent="pressKey(k.en)">
        <span class="zh">{{k.zh}}</span>
        <span class="en">{{k.en}}</span>
      </div>
    </div>
  </div>

  <!-- Overlays -->
  <div id="overlay" v-if="phase==='start'">
    <h1>⚔️ 注音打字大冒險</h1>
    <p>打出注音符號擊敗怪物！<br>每打對一字造成傷害 🗡️<br>打錯會扣 2 秒⏱ 時間到扣 HP ❤️<br><br>
      💡 <b>手機</b>：點擊虛擬鍵盤<br>
      💻 <b>電腦</b>：直接打注音鍵盤</p>
    <button class="btn" @click="startGame">開始遊戲 ▶</button>
  </div>
  <div id="overlay" v-if="phase==='gameover'">
    <div id="gameover-title">💀 遊戲結束</div>
    <div id="final-score">得分：{{score}} 分</div>
    <p>擊殺怪物：{{score}} 隻<br>最高關卡：Lv.{{level}}</p>
    <button class="btn" @click="restartGame" style="margin-top:14px">再玩一次 🔄</button>
  </div>

</div>
<script>
const { createApp, ref, computed, onMounted, onUnmounted } = Vue;

// ── Standard TW Zhuyin keyboard (physical keyboard row layout) ──
const KB_ROWS = [
  // Number row
  [{zh:'ㄅ',en:'1'},{zh:'ㄉ',en:'2'},{zh:'ˇ',en:'3',tone:true},{zh:'ˋ',en:'4',tone:true},
   {zh:'ㄓ',en:'5'},{zh:'ˊ',en:'6',tone:true},{zh:'˙',en:'7',tone:true},
   {zh:'ㄚ',en:'8'},{zh:'ㄞ',en:'9'},{zh:'ㄢ',en:'0'},{zh:'ㄦ',en:'-'}],
  // QWERTY row
  [{zh:'ㄆ',en:'q'},{zh:'ㄊ',en:'w'},{zh:'ㄍ',en:'e'},{zh:'ㄐ',en:'r'},
   {zh:'ㄔ',en:'t'},{zh:'ㄗ',en:'y'},{zh:'ㄧ',en:'u'},{zh:'ㄛ',en:'i'},
   {zh:'ㄟ',en:'o'},{zh:'ㄣ',en:'p'}],
  // ASDF row
  [{zh:'ㄇ',en:'a'},{zh:'ㄋ',en:'s'},{zh:'ㄎ',en:'d'},{zh:'ㄑ',en:'f'},
   {zh:'ㄕ',en:'g'},{zh:'ㄘ',en:'h'},{zh:'ㄨ',en:'j'},{zh:'ㄜ',en:'k'},
   {zh:'ㄠ',en:'l'},{zh:'ㄤ',en:';'}],
  // ZXCV row
  [{zh:'ㄈ',en:'z'},{zh:'ㄌ',en:'x'},{zh:'ㄏ',en:'c'},{zh:'ㄒ',en:'v'},
   {zh:'ㄖ',en:'b'},{zh:'ㄙ',en:'n'},{zh:'ㄩ',en:'m'},{zh:'ㄝ',en:','},
   {zh:'ㄡ',en:'.'},{zh:'ㄥ',en:'/'}],
  // Space
  [{zh:'空白 ＝ 一聲（不標調）',en:'SPC',tone:true}],
];

const KEY_TO_ZH = {};
KB_ROWS.flat().forEach(k => { KEY_TO_ZH[k.en] = k.zh; });
KEY_TO_ZH[' '] = 'SPC_ZH'; // internal marker for space

// ── Sentence pool: words with hanzi + zhuyin groups ──
const SENTENCES = [
  // Short
  { words:[{h:'你',z:['ㄋ','ㄧ','ˇ']},{h:'好',z:['ㄏ','ㄠ','ˇ']}] },
  { words:[{h:'謝',z:['ㄒ','ㄧ','ㄝ','ˋ']},{h:'謝',z:['ㄒ','ㄧ','ㄝ']}] },
  { words:[{h:'每',z:['ㄇ','ㄟ','ˇ']},{h:'天',z:['ㄊ','ㄧ','ㄢ']}] },
  { words:[{h:'好',z:['ㄏ','ㄠ','ˇ']},{h:'吃',z:['ㄔ']}] },
  // Medium
  { words:[{h:'我',z:['ㄨ','ㄛ','ˇ']},{h:'愛',z:['ㄞ','ˋ']},{h:'學',z:['ㄒ','ㄩ','ㄝ','ˊ']},{h:'習',z:['ㄒ','ㄧ','ˊ']}] },
  { words:[{h:'天',z:['ㄊ','ㄧ','ㄢ']},{h:'氣',z:['ㄑ','ㄧ','ˋ']},{h:'很',z:['ㄏ','ㄣ','ˇ']},{h:'好',z:['ㄏ','ㄠ','ˇ']}] },
  { words:[{h:'小',z:['ㄒ','ㄧ','ㄠ','ˇ']},{h:'朋',z:['ㄆ','ㄥ','ˊ']},{h:'友',z:['ㄧ','ㄡ','ˇ']}] },
  { words:[{h:'早',z:['ㄗ','ㄠ','ˇ']},{h:'上',z:['ㄕ','ㄤ','ˋ']},{h:'好',z:['ㄏ','ㄠ','ˇ']}] },
  // Longer
  { words:[{h:'我',z:['ㄨ','ㄛ','ˇ']},{h:'喜',z:['ㄒ','ㄧ','ˇ']},{h:'歡',z:['ㄏ','ㄨ','ㄢ']},{h:'巧',z:['ㄑ','ㄧ','ㄠ','ˊ']},{h:'克',z:['ㄎ','ㄜ','ˋ']},{h:'力',z:['ㄌ','ㄧ','ˋ']}] },
  { words:[{h:'注',z:['ㄓ','ㄨ','ˋ']},{h:'音',z:['ㄧ','ㄣ']},{h:'打',z:['ㄉ','ㄚ','ˋ']},{h:'字',z:['ㄗ','ˋ']},{h:'很',z:['ㄏ','ㄣ','ˇ']},{h:'酷',z:['ㄎ','ㄨ','ˋ']}] },
];

function sentenceToFlat(s) {
  return s.words.flatMap(w => w.z);
}
function sentenceToWords(s) {
  let idx = 0;
  return s.words.map(w => { const r = {...w, startIdx: idx}; idx += w.z.length; return r; });
}

const PRAISES   = ['太棒了！','厲害！','完美！','超強！','好厲害！','無敵了！'];
const MON_COLS  = [0xe74c3c,0x9b59b6,0x27ae60,0xf39c12,0x2980b9,0x16a085,0xc0392b];

// ── Monster sprite config ──
const MON_COLORS = ['blue','dark','green','red','white','yellow'];
const BODY_VARIANTS = ['A','B','C','D','E','F'];
const ARM_VARIANTS  = ['A','B','C','D','E'];
const LEG_VARIANTS  = ['A','B','C','D','E'];
const EYE_TYPES = [
  'eye_angry_blue','eye_angry_green','eye_angry_red','eye_blue','eye_cute_dark',
  'eye_cute_light','eye_human','eye_human_blue','eye_human_green','eye_human_red',
  'eye_psycho_dark','eye_psycho_light','eye_red','eye_yellow'
];
const MOUTH_TYPES = [
  'mouthA','mouthB','mouthC','mouthD','mouthE','mouthF','mouthG','mouthH','mouthI','mouthJ',
  'mouth_closed_fangs','mouth_closed_happy','mouth_closed_sad','mouth_closed_teeth'
];
const DETAIL_TYPES = ['antenna_large','antenna_small','ear','ear_round','horn_large','horn_small'];
let monsterTextures = null; // will hold {name -> PIXI.Texture}

createApp({
  setup() {
    const phase         = ref('start');
    const score         = ref(0);
    const hp            = ref(3);
    const level         = ref(1);
    const cursor        = ref(0);
    const wrongIdx      = ref(-1);
    const activeKeys    = ref(new Set());
    const currentWords  = ref([]);   // [{h, z, startIdx}, ...]
    const flatSentence  = ref([]);   // flat zhuyin array
    const flatLen       = computed(() => flatSentence.value.length);
    const timerPct      = ref(100);
    const kbRows        = ref(KB_ROWS);
    const comboMsg      = ref(null);
    const dmgFlash      = ref(null);
    const mobileInput   = ref(null);
    const penaltyMsg    = ref(null);

    let pixiApp=null, monster=null;
    let monsterHP=0, monsterMaxHP=0;
    let hpBarFill=null, hpText=null;
    let timerInterval=null, bounceTicker=null;
    let bgTextures=null; // background element textures
    let timeLeft=0, timeTotal=0;
    let usedIdx=new Set();
    let wrongTimer=null;      // debounce wrongIdx clear
    const WRONG_PENALTY=2000;

    // ── Focus ──
    function focusMobile(){ if(mobileInput.value) mobileInput.value.focus(); }
    function refocusMobile(){ if(phase.value==='playing') setTimeout(focusMobile,80); }
    function onMobileInput(){ if(mobileInput.value) mobileInput.value.value=''; }

    // ── Core input handler ──
    function handleInput(key) {
      if(phase.value!=='playing') return;
      const zh = key===' ' ? null : KEY_TO_ZH[key];
      if(!zh && key!==' ') return;

      // flash virtual key
      const dispKey = key===' ' ? 'SPC' : key;
      activeKeys.value = new Set([...activeKeys.value, dispKey]);
      setTimeout(()=>{ activeKeys.value=new Set([...activeKeys.value].filter(k=>k!==dispKey)); },150);

      const expected = flatSentence.value[cursor.value];
      const isCorrect = zh===expected;

      if(isCorrect) {
        // Clear any pending wrongIdx on this position
        if(wrongIdx.value===cursor.value){
          if(wrongTimer){ clearTimeout(wrongTimer); wrongTimer=null; }
          wrongIdx.value=-1;
        }
        cursor.value++;
        damageMonster();
        if(cursor.value>=flatSentence.value.length){
          clearInterval(timerInterval);
          score.value++;
          if(score.value%3===0) level.value++;
          showPraise();
          if(monsterHP<=0) killMonster();
          setTimeout(()=>loadSentence(),500);
        }
      } else {
        // Wrong: set wrongIdx with debounced clear
        if(wrongTimer) clearTimeout(wrongTimer);
        wrongIdx.value=cursor.value;
        wrongTimer=setTimeout(()=>{ wrongIdx.value=-1; wrongTimer=null; },350);
        applyTimePenalty();
      }
    }

    function onKeyDown(e){
      if(phase.value!=='playing') return;
      if(e.repeat) return;                    // ignore key-repeat (long press)
      if(e.isComposing || e.keyCode===229) return;
      if(['Tab','Enter','Shift','Control','Alt','Meta','CapsLock'].includes(e.key)) return;
      e.preventDefault();
      handleInput(e.key===' ' ? ' ' : e.key.toLowerCase());
    }
    function onKeyUp(e){
      // keyup only used to prevent default, input handled on keydown
    }
    function pressKey(en){
      if(phase.value!=='playing') return;
      handleInput(en==='SPC'?' ':en);
    }

    // ── Pixi ──
    async function loadMonsterSheet(){
      if(monsterTextures) return;
      const xmlRes = await fetch('assets/monsters/spritesheet_default.xml');
      const xmlText = await xmlRes.text();
      const doc = new DOMParser().parseFromString(xmlText,'text/xml');
      const baseTex = PIXI.BaseTexture.from('assets/monsters/spritesheet_default.png');
      monsterTextures = {};
      doc.querySelectorAll('SubTexture').forEach(st=>{
        const name = st.getAttribute('name').replace('.png','');
        const x=+st.getAttribute('x'), y=+st.getAttribute('y');
        const w=+st.getAttribute('width'), h=+st.getAttribute('height');
        monsterTextures[name] = new PIXI.Texture(baseTex, new PIXI.Rectangle(x,y,w,h));
      });
    }
    function syncCanvasSize(){
      const area=document.getElementById('monster-area');
      const w=area.clientWidth, h=area.clientHeight;
      if(pixiApp && (pixiApp.renderer.width!==w || pixiApp.renderer.height!==h)){
        pixiApp.renderer.resize(w,h);
      }
      return {w,h};
    }
    async function loadBgTextures(){
      if(bgTextures) return;
      const flat='assets/kenney_background-elements/PNG/Flat/';
      const col='assets/kenney_background-elements/PNG/';
      bgTextures={};
      // full-width strips (Flat, tinted)
      for(const n of ['clouds1','clouds2','pointy_mountains','hills1','hills2']){
        bgTextures[n]=PIXI.Texture.from(flat+n+'.png');
      }
      // colored individual elements (no tint needed)
      for(const n of ['tree02','tree03','cloud1','cloud2','castle_beige','sun']){
        bgTextures[n]=PIXI.Texture.from(col+n+'.png');
      }
    }
    function buildBackground(W,H){
      const bg=new PIXI.Container();
      if(!bgTextures) return bg;
      // helper: add full-width strip
      const strip=(name,tint,yRatio,scaleH)=>{
        const sp=new PIXI.Sprite(bgTextures[name]);
        sp.tint=tint;
        sp.width=W;
        sp.height=H*scaleH;
        sp.y=H*yRatio;
        bg.addChild(sp);
      };
      // helper: add individual element (colored, no tint)
      const elem=(name,xRatio,yRatio,h,anchorY)=>{
        const sp=new PIXI.Sprite(bgTextures[name]);
        sp.anchor.set(0.5,anchorY??1);
        sp.height=H*h;
        sp.scale.x=sp.scale.y;
        sp.x=W*xRatio;
        sp.y=H*yRatio;
        bg.addChild(sp);
        return sp;
      };
      // sun
      elem('sun',0.85,0.12,0.12,0.5);
      // individual clouds (colored)
      elem('cloud1',0.15,0.08,0.10,0.5);
      elem('cloud2',0.55,0.14,0.08,0.5);
      elem('cloud1',0.80,0.06,0.07,0.5);
      // far mountains (Flat strip, tinted gray-blue)
      strip('pointy_mountains',0x8BA5B0,0.30,0.30);
      // far cloud strip
      strip('clouds2',0xffffff,0.08,0.20);
      // hills (Flat strips, tinted green)
      strip('hills1',0x7CB342,0.55,0.22);
      strip('hills2',0x558B2F,0.63,0.22);
      // ground fill
      const ground=new PIXI.Graphics();
      ground.beginFill(0x6D4C41);
      ground.drawRect(0,H*0.78,W,H*0.22);
      ground.endFill();
      // grass strip on ground
      const grass=new PIXI.Graphics();
      grass.beginFill(0x4CAF50);
      grass.drawRect(0,H*0.76,W,H*0.04);
      grass.endFill();
      bg.addChild(ground);
      bg.addChild(grass);
      // trees & castle (colored PNGs)
      elem('tree02',0.06,0.78,0.24);
      elem('tree03',0.20,0.79,0.20);
      elem('tree02',0.78,0.78,0.22);
      const c=elem('castle_beige',0.92,0.74,0.28);
      // mirror one tree for variety
      const t=elem('tree03',0.65,0.80,0.18);
      t.scale.x=-t.scale.y;
      return bg;
    }
    async function initPixi(){
      const area=document.getElementById('monster-area');
      const w=area.clientWidth, h=area.clientHeight;
      pixiApp=new PIXI.Application({view:document.getElementById('monster-canvas'),width:w,height:h,backgroundColor:0x87CEEB,antialias:true});
      await Promise.all([loadMonsterSheet(), loadBgTextures()]);
      syncCanvasSize();
      spawnMonster();
    }
    function resizePixi(){
      if(!pixiApp) return;
      syncCanvasSize();
      spawnMonster();
    }

    function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

    function spawnMonster(){
      if(!pixiApp||!monsterTextures) return;
      pixiApp.stage.removeChildren();
      const W=pixiApp.renderer.width,H=pixiApp.renderer.height;

      // layered background
      pixiApp.stage.addChild(buildBackground(W,H));

      const mc=new PIXI.Container(); mc.x=W/2;
      pixiApp.stage.addChild(mc);
      monster=mc;

      // pick random parts
      const color = pick(MON_COLORS);
      const bodyV = pick(BODY_VARIANTS);
      const armV  = pick(ARM_VARIANTS);
      const legV  = pick(LEG_VARIANTS);
      const eyeType   = pick(EYE_TYPES);
      const mouthType = pick(MOUTH_TYPES);

      const tex = (name) => monsterTextures[name];

      // body
      const bodyTex = tex(`body_${color}${bodyV}`);
      const bodySprite = new PIXI.Sprite(bodyTex);
      bodySprite.anchor.set(0.5,0.5);
      const bodyW = bodyTex.width, bodyH = bodyTex.height;

      // calculate total monster height (top to bottom) for proper scaling
      const legTex = tex(`leg_${color}${legV}`);
      const legH = legTex ? legTex.height : 0;
      const topExtent = bodyH*0.5 + 70/1; // body top half + HP bar space (in screen px, handled later)
      const bottomExtent = bodyH*0.28 + legH; // leg offset + leg height
      const totalH = bodyH*0.5 + bottomExtent; // body top half + bottom extent (sprite space)

      // scale: fit entire monster (body+legs) within 80% of canvas, leave room for HP bar
      const hpBarSpace = 80; // px reserved for HP bar above monster
      const bottomPad = 30; // px padding at bottom
      const availableH = H - hpBarSpace - bottomPad;
      const sc = Math.min(availableH / totalH, 1.5);
      mc.scale.set(sc);

      // center monster vertically: offset so body center is above midpoint (legs hang below)
      const monsterTopPx = bodyH*0.5*sc;    // body top half in px
      const monsterBottomPx = bottomExtent*sc; // legs bottom in px
      mc.y = hpBarSpace + monsterTopPx + (availableH - monsterTopPx - monsterBottomPx)/2;

      // legs (behind body)
      if(legTex){
        const legL = new PIXI.Sprite(legTex);
        legL.anchor.set(0.5,0);
        legL.x = -bodyW*0.2; legL.y = bodyH*0.28;
        mc.addChild(legL);
        const legR = new PIXI.Sprite(legTex);
        legR.anchor.set(0.5,0);
        legR.x = bodyW*0.2; legR.y = bodyH*0.28;
        mc.addChild(legR);
      }

      // arms (behind body)
      const armTex = tex(`arm_${color}${armV}`);
      if(armTex){
        const armL = new PIXI.Sprite(armTex);
        armL.anchor.set(0.8,0.2);
        armL.x = -bodyW*0.42;  armL.y = -bodyH*0.05;
        mc.addChild(armL);
        const armR = new PIXI.Sprite(armTex);
        armR.anchor.set(0.2,0.2);
        armR.scale.x = -1; // mirror
        armR.x = bodyW*0.42; armR.y = -bodyH*0.05;
        mc.addChild(armR);
      }

      // body (on top)
      mc.addChild(bodySprite);

      // detail (horn/ear/antenna on top of body)
      if(Math.random()>0.3){
        const detailType = pick(DETAIL_TYPES);
        const detailTex = tex(`detail_${color}_${detailType}`);
        if(detailTex){
          const detL = new PIXI.Sprite(detailTex);
          detL.anchor.set(0.5,1);
          detL.x = -bodyW*0.22; detL.y = -bodyH*0.38;
          mc.addChild(detL);
          const detR = new PIXI.Sprite(detailTex);
          detR.anchor.set(0.5,1);
          detR.scale.x = -1;
          detR.x = bodyW*0.22; detR.y = -bodyH*0.38;
          mc.addChild(detR);
        }
      }

      // eyes
      const eyeTex = tex(eyeType);
      if(eyeTex){
        const eyeL = new PIXI.Sprite(eyeTex);
        eyeL.anchor.set(0.5,0.5);
        eyeL.x = -bodyW*0.15; eyeL.y = -bodyH*0.1;
        mc.addChild(eyeL);
        const eyeR = new PIXI.Sprite(eyeTex);
        eyeR.anchor.set(0.5,0.5);
        eyeR.x = bodyW*0.15; eyeR.y = -bodyH*0.1;
        mc.addChild(eyeR);
      }

      // mouth
      const mouthTex = tex(mouthType);
      if(mouthTex){
        const mouth = new PIXI.Sprite(mouthTex);
        mouth.anchor.set(0.5,0.5);
        mouth.x = 0; mouth.y = bodyH*0.15;
        mc.addChild(mouth);
      }

      // HP bar (drawn in screen space, not scaled with monster)
      const hpContainer = new PIXI.Container();
      hpContainer.scale.set(1/sc); // counter the monster scale
      const bw=140;
      const hpBg=new PIXI.Graphics();
      hpBg.beginFill(0x333333); hpBg.drawRoundedRect(-bw/2,-70,bw,16,4); hpBg.endFill();
      hpContainer.addChild(hpBg);

      monsterMaxHP=5+level.value*2; monsterHP=monsterMaxHP;
      hpBarFill=new PIXI.Graphics(); drawHPBar(); hpContainer.addChild(hpBarFill);
      hpText=new PIXI.Text(`${monsterHP}/${monsterMaxHP}`,{fontSize:14,fill:0xffffff,fontWeight:'bold'});
      hpText.anchor.set(0.5,0); hpText.x=0; hpText.y=-70; hpContainer.addChild(hpText);
      mc.addChild(hpContainer);

      if(bounceTicker){pixiApp.ticker.remove(bounceTicker);bounceTicker=null;}
      let t=Math.random()*Math.PI*2;
      const baseY=mc.y;
      bounceTicker=()=>{t+=0.04; mc.y=baseY+Math.sin(t)*5;};
      pixiApp.ticker.add(bounceTicker);
    }

    function drawHPBar(){
      if(!hpBarFill) return;
      const bw=140,pct=Math.max(0,monsterHP/monsterMaxHP);
      hpBarFill.clear();
      hpBarFill.beginFill(pct>0.5?0x2ecc71:pct>0.25?0xf39c12:0xe74c3c);
      hpBarFill.drawRoundedRect(-bw/2,-70,bw*pct,16,4);
      hpBarFill.endFill();
      if(hpText) hpText.text=`${Math.max(0,monsterHP)}/${monsterMaxHP}`;
    }
    function damageMonster(){
      monsterHP--; drawHPBar();
      if(monster){monster.alpha=0.4;setTimeout(()=>{if(monster)monster.alpha=1;},100);}
    }
    function killMonster(){
      if(!monster) return;
      const dying=monster; monster=null;
      if(bounceTicker){pixiApp.ticker.remove(bounceTicker);bounceTicker=null;}
      let sc=1;
      const tk=pixiApp.ticker.add(()=>{
        sc-=0.08; dying.scale.set(Math.max(0,sc)); dying.alpha=sc;
        if(sc<=0) pixiApp.ticker.remove(tk);
      });
      setTimeout(()=>spawnMonster(),600);
    }
    function darken(c,f){
      return(Math.floor(((c>>16)&0xff)*f)<<16)|(Math.floor(((c>>8)&0xff)*f)<<8)|Math.floor((c&0xff)*f);
    }

    // ── Sentence ──
    function pickSentence(){
      const pool=level.value<=2?SENTENCES.slice(0,4):level.value<=4?SENTENCES.slice(2,8):SENTENCES.slice(5);
      if(usedIdx.size>=pool.length) usedIdx.clear();
      let idx; do{idx=Math.floor(Math.random()*pool.length);}while(usedIdx.has(idx));
      usedIdx.add(idx);
      return pool[idx];
    }
    function loadSentence(){
      cursor.value=0; wrongIdx.value=-1;
      if(wrongTimer){clearTimeout(wrongTimer);wrongTimer=null;}
      const s=pickSentence();
      flatSentence.value=sentenceToFlat(s);
      currentWords.value=sentenceToWords(s);
      startTimer(); focusMobile();
    }

    // ── Timer ──
    function startTimer(){
      clearInterval(timerInterval);
      timeTotal=flatSentence.value.length*3000;
      timeLeft=timeTotal; timerPct.value=100;
      timerInterval=setInterval(()=>{
        timeLeft-=100;
        timerPct.value=Math.max(0,timeLeft/timeTotal*100);
        if(timeLeft<=0){clearInterval(timerInterval);onTimerExpire();}
      },100);
    }
    function onTimerExpire(){
      const f=dmgFlash.value;
      if(f){f.classList.add('flash');setTimeout(()=>f.classList.remove('flash'),300);}
      hp.value--;
      if(hp.value<=0){phase.value='gameover';clearInterval(timerInterval);return;}
      loadSentence();
    }
    function applyTimePenalty(){
      timeLeft=Math.max(0,timeLeft-WRONG_PENALTY);
      timerPct.value=Math.max(0,timeLeft/timeTotal*100);
      const el=penaltyMsg.value; if(!el) return;
      el.classList.remove('show');
      void el.offsetWidth; // reflow to restart animation
      el.classList.add('show');
      setTimeout(()=>el.classList.remove('show'),700);
      if(timeLeft<=0){clearInterval(timerInterval);onTimerExpire();}
    }
    function showPraise(){
      const el=comboMsg.value; if(!el) return;
      el.textContent=PRAISES[Math.floor(Math.random()*PRAISES.length)];
      el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),700);
    }

    // ── Game control ──
    async function startGame(){
      score.value=0;hp.value=3;level.value=1;usedIdx.clear();
      phase.value='playing';
      // wait for Vue to update DOM + CSS layout to settle
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
      if(!pixiApp){
        await initPixi();
        loadSentence();
      } else{syncCanvasSize();spawnMonster();loadSentence();}
    }
    function restartGame(){startGame();}

    onMounted(()=>{
      window.addEventListener('keydown',onKeyDown);
      window.addEventListener('keyup',onKeyUp);
      window.addEventListener('resize',resizePixi);
    });
    onUnmounted(()=>{
      window.removeEventListener('keydown',onKeyDown);
      window.removeEventListener('keyup',onKeyUp);
      window.removeEventListener('resize',resizePixi);
      clearInterval(timerInterval);
      if(wrongTimer) clearTimeout(wrongTimer);
      if(pixiApp) pixiApp.destroy();
    });

    return {
      phase,score,hp,level,cursor,wrongIdx,activeKeys,
      currentWords,flatLen,timerPct,kbRows,
      comboMsg,dmgFlash,mobileInput,penaltyMsg,
      startGame,restartGame,pressKey,
      onKeyDown,onKeyUp,onMobileInput,focusMobile,refocusMobile,
    };
  }
}).mount('#app');
</script>
</body>
</html>
